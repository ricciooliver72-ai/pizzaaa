<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL ACCESS - SYSTEM STATUS</title>
    <style>
        /* Impostazioni generali dello schermo stile Hacker */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030303;
            color: #00ff33;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            padding: 30px;
            font-size: 16px;
        }

        /* Linee orizzontali per simulare un vecchio monitor CRT */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 5;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        #terminal {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .line {
            margin-bottom: 8px;
            white-space: pre-wrap;
            letter-spacing: 1px;
        }

        /* STILE ROSSO LUMINOSO PER SOFIA E DESIO */
        .target-data {
            color: #ff003c;
            font-weight: bold;
            text-shadow: 0 0 12px #ff003c, 0 0 5px #ff003c;
        }

        .alert-text {
            color: #ffcc00;
        }

        .success-text {
            color: #00ff33;
            text-shadow: 0 0 8px #00ff33;
        }

        /* Schermata di avviso centrale che appare alla fine */
        #popup-allerta {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(15, 0, 5, 0.95);
            border: 2px solid #ff003c;
            padding: 40px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 0 40px rgba(255, 0, 60, 0.6);
            width: 85%;
            max-width: 550px;
        }

        #popup-allerta h1 {
            color: #ff003c;
            font-size: 2.2rem;
            margin-bottom: 25px;
            letter-spacing: 3px;
            animation: lampeggio 0.6s infinite alternate;
        }

        #popup-allerta p {
            color: #ffffff;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        @keyframes lampeggio {
            from { opacity: 1; }
            to { opacity: 0.2; }
        }

        /* Nasconde la barra di scorrimento standard */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ff33;
        }
    </style>
</head>
<body>

    <div id="terminal"></div>

    <div id="popup-allerta">
        <h1>ATTACCO COMPLETATO</h1>
        <p>Infiltrazione eseguita nei nodi locali.</p>
        <p>Soggetto Rintracciato: <span class="target-data">SOFIA</span></p>
        <p>Area Geografica: <span class="target-data">DESIO</span></p>
        <p style="color: #666; font-size: 0.8rem; margin-top: 30px;">[Stato della sessione: Connesso in remoto]</p>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const popupAllerta = document.getElementById('popup-allerta');

        // Sequenza dei messaggi della finta violazione
        const logAttacco = [
            { testo: "Inizializzazione protocollo di exploit remoto...", attesa: 400 },
            { testo: "Connessione alla rete anonima TOR superata... 3 nodi attivi.", attesa: 600 },
            { testo: "Scansione sottorete locale in corso (provincia di Monza e Brianza)...", attesa: 900 },
            { testo: "Testing vulnerabilità sui nodi regionali...", attesa: 500 },
            { testo: "Bypassing protocollo di sicurezza WPA3... OK", attesa: 400 },
            { testo: "Iniezione pacchetti di overlay nel server centrale...", attesa: 700 },
            { testo: "Intercettazione pacchetti handshake... Decrittazione in corso.", attesa: 800 },
            { testo: "-------------------------------------------------------------", attesa: 200 },
            { testo: "[!] NOTIFICA: Trovata corrispondenza esatta nel database locale.", attesa: 500, classe: "alert-text" },
            { testo: "[*] TARGET IDENTIFICATO: <span class='target-data'>SOFIA</span>", attesa: 1000 },
            { testo: "[*] LOCALIZZAZIONE NODO: <span class='target-data'>DESIO</span>", attesa: 1000 },
            { testo: "-------------------------------------------------------------", attesa: 200 },
            { testo: "Apertura backdoor sulla porta remota 8080...", attesa: 600 },
            { testo: "Caricamento script di tracciamento nella cache del browser...", attesa: 700 },
            { testo: "Sincronizzazione dati in corso: [████████████████████] 100%", attesa: 1200, classe: "success-text" },
            { testo: "Download dei file di configurazione terminato con successo.", attesa: 400 },
            { testo: "Rimozione file temporanei e tracce d'accesso (clearev)... PRONTO.", attesa: 600 },
            { testo: "Generazione resoconto finale dell'intrusione..." , attesa: 1100 }
        ];

        let rigaCorrente = 0;

        function avviaSimulazione() {
            if (rigaCorrente < logAttacco.length) {
                const datiRiga = logAttacco[rigaCorrente];
                const elementoRiga = document.createElement('div');
                elementoRiga.className = 'line';
                
                if (datiRiga.classe) {
                    elementoRiga.classList.add(datiRiga.classe);
                }
                
                // Genera l'orario reale del computer corrente
                const orario = new Date().toLocaleTimeString();
                elementoRiga.innerHTML = `[${orario}] ${datiRiga.testo}`;
                
                terminal.appendChild(elementoRiga);
                terminal.scrollTop = terminal.scrollHeight;
                
                rigaCorrente++;
                setTimeout(avviaSimulazione, datiRiga.attesa);
            } else {
                // Al termine, sfoca il terminale e attiva la schermata rossa
                setTimeout(() => {
                    terminal.style.filter = "blur(5px)";
                    popupAllerta.style.display = "block";
                }, 1200);
            }
        }

        // Avvio automatico dopo 1 secondo
        setTimeout(avviaSimulazione, 1000);
    </script>
</body>
</html>
