<!DOCTYPE html>
<html>
<head>
<title>SYSTEM BREACH</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
}

/* MATRIX */
canvas {
  position: absolute;
  top: 0;
  left: 0;
}

/* GLITCH LAYERS */
.glitch {
  position: absolute;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,255,0,0.03),
    rgba(255,0,0,0.03),
    rgba(0,0,255,0.03)
  );
  animation: flicker 0.08s infinite;
}

@keyframes flicker {
  0% { transform: translate(1px,1px); }
  25% { transform: translate(-1px,1px); }
  50% { transform: translate(1px,-1px); }
  75% { transform: translate(-1px,-1px); }
  100% { transform: translate(1px,1px); }
}

/* TERMINAL */
#terminal {
  position: absolute;
  top: 8%;
  left: 5%;
  width: 90%;
  color: #00ff00;
  font-size: 18px;
  white-space: pre-line;
}

/* ASCII SKULL */
#skull {
  position: absolute;
  top: 55%;
  left: 50%;
  transform: translate(-50%,-50%);
  color: #00ff00;
  font-size: 14px;
  line-height: 14px;
  white-space: pre;
  display: none;
  text-shadow: 0 0 10px #00ff00;
}

/* RED ALERT */
#alert {
  position: absolute;
  bottom: 40px;
  width: 100%;
  text-align: center;
  color: red;
  font-size: 20px;
  opacity: 0;
}

/* FLASH */
#flash {
  position: absolute;
  width: 100%;
  height: 100%;
  background: red;
  opacity: 0;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<div class="glitch"></div>

<div id="terminal"></div>

<pre id="skull">
      ███████████
   ███  ███████  ███
  ██   █  ██  █   ██
 ██    █      █    ██
 ██    ████████    ██
  ██              ██
   ███          ███
      ███████████
</pre>

<div id="alert">SISTEMA COMPROMESSO — SOFIA — DESIO</div>
<div id="flash"></div>

<audio id="audio" loop>
  <source src="https://actions.google.com/sounds/v1/horror/ambient_horror_whispers.ogg" type="audio/ogg">
</audio>

<script>

/* MATRIX */
const c = document.getElementById("c");
const ctx = c.getContext("2d");

c.width = window.innerWidth;
c.height = window.innerHeight;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ☠☠☠";
const fontSize = 16;
const columns = c.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.07)";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle = "#00ff00";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if (drops[i]*fontSize > c.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}
setInterval(draw, 18);

/* TERMINAL HACK SIM */
const terminal = document.getElementById("terminal");

const lines = [
"[SYSTEM] boot sequence started...",
"[SCAN] device detected",
"[TRACE] location found: DESIO",
"[USER] identity: SOFIA",
"[WARNING] firewall bypassed",
"[ACCESS] root privileges granted",
"[UPLOAD] monitoring active",
"[STATUS] SYSTEM COMPROMISED"
];

let i = 0;

function type() {
  if (i < lines.length) {
    terminal.innerHTML += lines[i] + "\\n";
    i++;
    setTimeout(type, 1200);
  }
}

setTimeout(type, 1000);

/* HORROR SEQUENCE */
setTimeout(() => {

  document.getElementById("skull").style.display = "block";
  document.getElementById("alert").style.opacity = 1;

  const audio = document.getElementById("audio");
  audio.volume = 1;
  audio.play().catch(()=>{});

  setInterval(() => {
    document.getElementById("flash").style.opacity =
      Math.random() > 0.8 ? 1 : 0;
  }, 70);

}, 9000);

/* SCREEN SHAKE */
setInterval(() => {
  document.body.style.transform =
    `translate(${Math.random()*3}px,${Math.random()*3}px)`;
}, 40);

</script>

</body>
</html>
